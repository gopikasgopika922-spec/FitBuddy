<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FitBuddy{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="/">FitBuddy</a>
    <nav>
        <a href="/">New Plan</a>
        <a href="/docs">API Docs</a>

</header>

</main>

<footer class="footer">

</footer>
</body>
</html>
